name: VirtualAI Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

  # ==================================
  # BACKEND
  # ==================================

  deploy-backend:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS connection
      - name: Verify AWS
        run: aws sts get-caller-identity

      # 4. Check required ECS secrets
      - name: Check ECS configuration
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          GATEWAY_SERVICE: ${{ secrets.GATEWAY_SERVICE }}
          AUTH_SERVICE: ${{ secrets.AUTH_SERVICE }}
          CHAT_SERVICE: ${{ secrets.CHAT_SERVICE }}
          AGENT_SERVICE: ${{ secrets.AGENT_SERVICE }}
          BILLING_SERVICE: ${{ secrets.BILLING_SERVICE }}
        run: |
          test -n "$ECS_CLUSTER" || (echo "ECS_CLUSTER secret is empty" && exit 1)
          test -n "$GATEWAY_SERVICE" || (echo "GATEWAY_SERVICE secret is empty" && exit 1)
          test -n "$AUTH_SERVICE" || (echo "AUTH_SERVICE secret is empty" && exit 1)
          test -n "$CHAT_SERVICE" || (echo "CHAT_SERVICE secret is empty" && exit 1)
          test -n "$AGENT_SERVICE" || (echo "AGENT_SERVICE secret is empty" && exit 1)
          test -n "$BILLING_SERVICE" || (echo "BILLING_SERVICE secret is empty" && exit 1)

          echo "All ECS configuration values are present."

      # 5. Login to Amazon ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ==================================
      # GATEWAY
      # ==================================

      - name: Build Gateway
        run: |
          docker build \
            -f backend/gateway/Dockerfile \
            -t gateway \
            backend

      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Push Gateway
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      # ==================================
      # AUTH
      # ==================================

      - name: Build Auth
        run: |
          docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service \
            backend

      - name: Tag Auth
        run: |
          docker tag auth-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: Push Auth
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      # ==================================
      # CHAT
      # ==================================

      - name: Build Chat
        run: |
          docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service \
            backend

      - name: Tag Chat
        run: |
          docker tag chat-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Push Chat
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      # ==================================
      # AGENT
      # ==================================

      - name: Build Agent
        run: |
          docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service \
            backend

      - name: Tag Agent
        run: |
          docker tag agent-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Push Agent
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      # ==================================
      # BILLING
      # ==================================

      - name: Build Billing
        run: |
          docker build \
            -f backend/services/billing/Dockerfile \
            -t billing-service \
            backend

      - name: Tag Billing
        run: |
          docker tag billing-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: Push Billing
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      # ==================================
      # DEPLOY ECS SERVICES
      # ==================================

      - name: Deploy Gateway
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.GATEWAY_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Deploy Auth
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.AUTH_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Deploy Chat
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.CHAT_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Deploy Agent
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.AGENT_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Deploy Billing
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.BILLING_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment


  # ==================================
  # FRONTEND
  # ==================================

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        working-directory: frontend
        env:
         VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
         VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: npm run build

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Deploy frontend to S3
      - name: Deploy frontend to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          test -n "$S3_BUCKET" || (echo "S3_BUCKET secret is empty" && exit 1)

          aws s3 sync frontend/dist \
            "s3://$S3_BUCKET" \
            --delete

      # 7. Deployment complete
      - name: Deployment completed
        run: |
          echo "VirtualAI deployment completed successfully."